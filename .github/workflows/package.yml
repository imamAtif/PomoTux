name: Package

# build -> {tarball, deb, rpm, appimage, flatpak} in parallel -> release.
# Every push to main refreshes the rolling `dev` prerelease automatically.
# Pushing a v* tag additionally publishes a stable versioned release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Sanity check
        run: python -m compileall -q pomotux main.py

      - name: Resolve version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0+${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --name PomoTux --onedir --windowed main.py

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: pyinstaller-dist
          path: dist/PomoTux

  tarball:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pyinstaller-dist
          path: dist/PomoTux

      - name: Pack tarball
        # artifact roundtrip drops the exec bit: restore it
        run: |
          chmod +x dist/PomoTux/PomoTux
          tar -czf "PomoTux-${{ needs.build.outputs.version }}-linux-x86_64.tar.gz" -C dist PomoTux

      - uses: actions/upload-artifact@v4
        with:
          name: pomotux-tarball
          path: PomoTux-*.tar.gz

  deb:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pyinstaller-dist
          path: dist/PomoTux

      - name: Build .deb
        run: |
          rm -rf pkgroot
          chmod +x dist/PomoTux/PomoTux # artifact roundtrip drops the exec bit
          mkdir -p pkgroot/opt/pomotux pkgroot/usr/bin \
            pkgroot/usr/share/applications pkgroot/usr/share/icons pkgroot/DEBIAN
          cp -r dist/PomoTux/. pkgroot/opt/pomotux/
          ln -s /opt/pomotux/PomoTux pkgroot/usr/bin/pomotux
          cp packaging/io.github.pomotux.desktop pkgroot/usr/share/applications/
          cp -r packaging/icons/hicolor pkgroot/usr/share/icons/
          cp packaging/icons/io.github.pomotux.svg pkgroot/usr/share/icons/
          {
            echo "Package: pomotux"
            echo "Version: ${{ needs.build.outputs.version }}"
            echo "Section: utils"
            echo "Priority: optional"
            echo "Architecture: amd64"
            echo "Maintainer: PomoTux Developers"
            echo "Description: Lightweight premium Pomodoro timer for Linux"
            echo " PomoTux is a fast, native Pomodoro timer with tasks,"
            echo " stats, tray integration and custom themes."
          } > pkgroot/DEBIAN/control
          dpkg-deb --root-owner-group --build pkgroot \
            "pomotux-${{ needs.build.outputs.version }}-amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: pomotux-deb
          path: pomotux-*.deb

  rpm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pyinstaller-dist
          path: dist/PomoTux

      - name: Build .rpm
        run: |
          rm -rf pkgroot
          chmod +x dist/PomoTux/PomoTux # artifact roundtrip drops the exec bit
          mkdir -p pkgroot/opt/pomotux pkgroot/usr/bin \
            pkgroot/usr/share/applications pkgroot/usr/share/icons
          cp -r dist/PomoTux/. pkgroot/opt/pomotux/
          ln -s /opt/pomotux/PomoTux pkgroot/usr/bin/pomotux
          cp packaging/io.github.pomotux.desktop pkgroot/usr/share/applications/
          cp -r packaging/icons/hicolor pkgroot/usr/share/icons/
          cp packaging/icons/io.github.pomotux.svg pkgroot/usr/share/icons/
          sudo gem install --no-document fpm
          fpm -s dir -t rpm -C pkgroot --name pomotux \
            --version "${{ needs.build.outputs.version }}" --architecture x86_64 \
            --description "Lightweight premium Pomodoro timer for Linux" \
            --package "pomotux-${{ needs.build.outputs.version }}-x86_64.rpm" opt usr

      - uses: actions/upload-artifact@v4
        with:
          name: pomotux-rpm
          path: pomotux-*.rpm

  appimage:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pyinstaller-dist
          path: dist/PomoTux

      - name: Build AppImage
        run: |
          rm -rf AppDir && mkdir -p AppDir/usr/bin
          chmod +x dist/PomoTux/PomoTux # artifact roundtrip drops the exec bit
          cp -r dist/PomoTux/. AppDir/usr/bin/
          ln -s PomoTux AppDir/usr/bin/pomotux
          cp packaging/io.github.pomotux.desktop AppDir/
          cp packaging/icons/hicolor/256x256/apps/io.github.pomotux.png AppDir/
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "${0}")")"\nexec "${HERE}/usr/bin/PomoTux" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir \
            "PomoTux-${{ needs.build.outputs.version }}-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: pomotux-appimage
          path: PomoTux-*.AppImage

  flatpak:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage sources
        # dir sources resolve relative paths ambiguously, so bake an
        # absolute source path into a generated manifest instead.
        run: |
          rm -rf flatpak-src build-dir repo flatpak-manifest.json
          mkdir flatpak-src
          git archive HEAD | tar -x -C flatpak-src
          sed "s|@POMOTUX_SRC@|$GITHUB_WORKSPACE/flatpak-src|" \
            packaging/flatpak/io.github.imamAtif.PomoTux.json.in > flatpak-manifest.json
          test -f flatpak-src/main.py && grep -q flatpak-src flatpak-manifest.json

      - name: Install flatpak
        run: sudo apt-get update -qq && sudo apt-get install -y -qq flatpak flatpak-builder

      - name: Install KDE SDK
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.kde.Platform//6.9 org.kde.Sdk//6.9 io.qt.PySide.BaseApp//6.9

      - name: Build
        run: >
          sudo flatpak-builder --force-clean --ccache --disable-rofiles-fuse
          --repo=repo build-dir flatpak-manifest.json

      - name: Smoke test
        run: >
          sudo flatpak-builder --run build-dir
          flatpak-manifest.json
          python3 /app/share/pomotux/main.py --version

      - name: Bundle
        run: >
          sudo flatpak build-bundle repo
          "pomotux-${{ needs.build.outputs.version }}-x86_64.flatpak"
          io.github.imamAtif.PomoTux
          && sudo chown runner:runner pomotux-*.flatpak

      - uses: actions/upload-artifact@v4
        with:
          name: pomotux-flatpak
          path: pomotux-*.flatpak

  release:
    needs: [tarball, deb, rpm, appimage, flatpak]
    runs-on: ubuntu-latest
    concurrency:
      group: pomotux-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: pomotux-*
          merge-multiple: true
          path: release-assets

      - name: Publish rolling dev release
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev --prerelease --title "Development build" \
            --notes "Latest automatic build from main. Stable versions are the v* releases below." \
            release-assets/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          gh release upload "$TAG" release-assets/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
